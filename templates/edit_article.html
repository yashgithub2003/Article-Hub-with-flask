{% extends 'layout.html' %}

{% block body %}
<h1>Edit Article</h1>

{% from "includes/_formhelper.html" import render_field %}

<form method="POST">
  {{ form.hidden_tag() }}

  <div class="mb-3">
    {{ render_field(form.title, class_="form-control") }}
  </div>

  <div class="mb-3">
    {{ render_field(form.body, class_="form-control", id="editor") }}
  </div>

  <input class="btn btn-primary" type="submit" value="Update">
</form>
{% endblock %}
